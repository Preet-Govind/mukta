[project]
name = "MuktaSlate"
version = "0.1.0"
description = "'Mukta', MuktaSlate, is an open source infinite canvas note app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "pymupdf",
    "pyqt6",
    "pyqtdarktheme",
]
